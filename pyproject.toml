[project]
name = "ai-context-ferry"
version = "0.1.0"
description = "开源跨平台的 AI 助手上下文迁移与交接工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",   # AES-256-GCM / Argon2id / X25519 等加密原语
    "jinja2>=3.1",          # 渲染 SESSION.md 交接文档
    "jsonschema>=4.0",      # 校验 asset-manifest v2.0.0
]

[project.scripts]
ai-context-ferry = "handoff_kit.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
